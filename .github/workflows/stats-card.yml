name: Stats card

on:
  schedule:
    # 03:00 UTC daily, which is 08:30 IST.
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate_card.py"
      - ".github/workflows/stats-card.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate card
        env:
          # A classic PAT with no scopes selected. Falls back to the
          # workflow token, which may under-report private contributions.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          GH_USER: ${{ github.repository_owner }}
        run: python .github/scripts/generate_card.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "chore: refresh stats card"
            git push
          fi
